name: Build Desktop Executables

# 打 tag（如 v1.0.0）或在 Actions 页面手动触发时，为 Windows / macOS 构建单文件可执行程序
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # 发布 Release 需要写权限

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: VideoGrab-Windows.exe
          - os: macos-latest
            artifact: VideoGrab-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install pyinstaller yt-dlp fastapi "uvicorn[standard]"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --name VideoGrab
          --add-data "static;static" --collect-all yt_dlp app.py

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --clean --onefile --name VideoGrab
          --add-data "static:static" --collect-all yt_dlp app.py

      - name: Rename artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/VideoGrab.exe "${{ matrix.artifact }}"
          else
            cp dist/VideoGrab "${{ matrix.artifact }}"
          fi

      - name: Build installer (Inno Setup, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "installer/videograb.iss" "/DAppVersion=$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.artifact }}
            installer/installer-output/Setup-VideoGrab.exe
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: github.ref != 'refs/tags/'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload installer artifact (manual runs, Windows)
        if: github.ref != 'refs/tags/' && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Setup-VideoGrab
          path: installer/installer-output/Setup-VideoGrab.exe
